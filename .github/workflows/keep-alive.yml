name: Sanjivani Backend Keep-Alive

on:
  schedule:
    - cron: '*/10 0-6,16-23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://sanjivani-9ne0.onrender.com/health)
          echo "Health check HTTP response: $response"
          if [ "$response" -ne 200 ]; then
            echo "::warning::Health check returned status $response"
          fi
